
<!DOCTYPE html>
<html lang="om">
<head>
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fayyaa Qori</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{font-family:Arial,sans-serif;background:#0d1117;color:#fff;margin:0;padding:16px}
  h1{color:#58a6ff;text-align:center;font-size:24px}
  .box{background:#161b22;border-radius:12px;padding:16px;margin:12px auto;max-width:560px}
  .warn{background:#4a3a10;color:#e3b341;border-radius:10px;padding:12px;max-width:560px;margin:10px auto;font-size:14px}
  .urgent{background:#4a1414;color:#ff7b72;border-radius:8px;padding:10px;margin-top:10px}
  label.chip{display:inline-block;background:#21262d;border-radius:20px;padding:8px 14px;margin:4px;font-size:15px}
  label.chip input{margin-right:6px}
  button{background:#238636;color:#fff;border:none;padding:12px 22px;font-size:16px;border-radius:8px;margin:6px}
  button.g{background:#30363d}
  h2,h3{color:#58a6ff;margin:8px 0}
  .item{border-top:1px solid #30363d;padding:10px 0}
  small{color:#8b949e}
  #qr{background:#fff;display:inline-block;padding:10px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<h1>🩺 FAYYAA QORI</h1>
<div class="warn">⚠️ App'iin kun odeeffannoo waliigalaa qofa. Doktora bakka hin bu'u. Dhibee adda hin baasu, dozii qorichaa hin kennu. Dhukkubsatte yoo ta'e kilinikaa/hospitaala deeme doktora argadhu.</div>

<div class="box">
  <h2>1. Mallattoo kee filadhu</h2>
  <div id="sx"></div>
  <button onclick="check()">Ilaali</button>
  <button class="g" onclick="resetAll()">Haqi</button>
</div>

<div id="out"></div>

<div class="box" id="all">
  <h2>Dhibeewwan hundumaa</h2>
  <div id="list"></div>
</div>

<script>
const SX = {
  fever:"Ho'a qaamaa", chills:"Qabbanaa'uu", headache:"Mata dhukkubbii", cough:"Qufaa",
  longcough:"Qufaa torbaan 2 ol", diarrhea:"Garaa kaasuu (bishaan)", vomit:"Ni hurrisa",
  breath:"Hafuura ariifachuu/ulfaachuu", rash:"Bar-bareeda (rash)", runny:"Funyaan dhangala'uu",
  ache:"Qaama dhukkubbii", sweat:"Dafqa halkan", weight:"Ulfaatina hir'achuu", belly:"Garaa dhukkubbii"
};
const D = [
 {id:"malaria", n:"Busaa (Malaria)", i:"🦟",
  s:["fever","chills","headache","vomit","sweat","ache"],
  what:"Ujummoo (hanqaaquu) Anopheles'n dhufu. Ho'aa fi qabbanaa'uun ni mul'ata.",
  med:"Qoricha malaariyaa (artemisinin-based combination therapy fakkaatan). Qorannoo (RDT/maayikiroskoopii) booda doktorri/gargaaraan fayyaa qofa kenna.",
  vac:"Talaalli beektaa Itoophiyaa keessatti hundaaf kennamu hin jiru. Ittisa: huccuu ujummoo (bed net), qilleensa mana keessaa, bishaan dhaabbatu balleessuu.",
  urg:"Ho'a ol-aanaa, hirriba/walbalaaluu, dhukkubbii mataa guddaa, qaaqii, daa'imman, ulfa."},
 {id:"typhoid", n:"Tayifoyiidii (Typhoid)", i:"🌡️",
  s:["fever","headache","belly","diarrhea","weight","vomit"],
  what:"Nyaata/bishaan xuraa'aa irraa dhufa. Ho'a guyyoota hedduu fi garaa dhukkubbii.",
  med:"Antibaayootikii — qorannoo booda doktorri qofa ajaja.",
  vac:"Talaalli tayifoyiidii (Typhoid) jira; iddoo kennamu kilinikaa keessatti gaafadhu. Ittisa: bishaan qulqulluu, harka dhiqachuu.",
  urg:"Ho'a guyyoota 3 ol, garaa cimaa dhukkubbii, dhiigni fincaan/bobba'uu."},
 {id:"flu", n:"Qufaa/Furrii (Cold/Flu)", i:"🤧",
  s:["cough","runny","fever","headache","ache"],
  what:"Vaayirasii irraa dhufa, baay'ee yeroo guyyaa 5-7 keessatti ofumaa fayya.",
  med:"Boqonnaa, dheebuu dhugaatii, ho'aaf paracetamol (dozii ajaja fayyaa ykn akeekkachiisa kutaa kuufama irraa). Antibaayootikiin vaayirasii irratti hin hojjetu.",
  vac:"Talaalli flu waggaa waggaan jira (filannoo); namoota ulfaa, jaarsolii fi dhukkuba dhaaluuf gaarii dha.",
  urg:"Hafuura ariifachuu, ho'a guyyaa 3 ol, ho'aan deebi'ee dhufu."},
 {id:"diarrhea", n:"Garaa Kaasuu (Diarrhea)", i:"💧",
  s:["diarrhea","vomit","belly","fever"],
  what:"Bishaan dhabuu (dehydration) dhukkuba guddaa dha, keessattuu daa'imman biratti.",
  med:"ORS (oral rehydration salts) fi daa'imman zinki; nyaata hin dhaabin. Antibaayootikii doktorri yoo ajaje qofa.",
  vac:"Talaalli Rotaavaayirasii daa'imman Itoophiyaa keessatti ni kennama. Ittisa: harka dhiqachuu, bishaan qulqulluu.",
  urg:"Afaan goggogaa, ijji gadi-buutu, fincaan xiqqaachuu, dhiiga, daa'ima xiqqaa."},
 {id:"pneumonia", n:"Neumooniyaa (Pneumonia)", i:"🫁",
  s:["cough","fever","breath","chills"],
  what:"Sombaa (lungs) kan qabu dha. Daa'imman fi jaarsolii irratti ulfaataa.",
  med:"Antibaayootikii (jiraachuu dhibee bakteeriyaan) doktorri/gargaaraan fayyaa qofa kenna.",
  vac:"Talaalli PCV fi Hib (Penta keessa jira) daa'imman Itoophiyaa keessatti ni kennama.",
  urg:"Hafuura ariifachuu, kan bokkaa'uu/shaamayaa'uu, ija bifa halluu, nyaata dhabuu."},
 {id:"measles", n:"Gifiira (Measles)", i:"🔴",
  s:["fever","rash","cough","runny"],
  what:"Vaayirasii saffisaan babal'atu. Ho'aa, ija diimaa, bar-bareedni qaama irra.",
  med:"Qoricha ga'aa miti; boqonnaa, dheebuu, Vitaamiin A (kilinikaa irraa). Doktoraan ilaalchisi.",
  vac:"Talaalli Measles (MCV) Itoophiyaa keessatti ni kennama (daa'imman jiraattota 9 fi 15 ji'aatti).",
  urg:"Hafuura ulfaachuu, hirriba, qaaqii, ija dhukkubuu."},
 {id:"tb", n:"Tiibii (TB)", i:"🩻",
  s:["longcough","weight","sweat","fever"],
  what:"Qufaa torbaan 2 ol, dafqa halkan, ulfaatinni hir'achuu mallattoo isaati.",
  med:"Qoricha TB walitti-fufinsa ji'a 6 ykn ol. Kilinikaa/hospitaala mootummaa irratti bilisaan kennama. Kutachuu hin qabdu.",
  vac:"Talaalli BCG ji'a jalqabaa daa'imman Itoophiyaa keessatti ni kennama.",
  urg:"Dhiiga qufuu, hafuura ulfaachuu, ulfaatina baay'ee hir'achuu."}
];

const sx=document.getElementById('sx');
Object.keys(SX).forEach(k=>{
  sx.insertAdjacentHTML('beforeend','<label class="chip"><input type="checkbox" value="'+k+'">'+SX[k]+'</label>');
});

function card(d, score){
  return '<div class="box"><h2>'+d.i+' '+d.n+(score?' <small>(mallattoo '+score+' wal-fakkaata)</small>':'')+'</h2>'+
  '<div class="item"><b>Maali?</b><br>'+d.what+'</div>'+
  '<div class="item"><b>💊 Gosa qorichaa (waliigalaa):</b><br>'+d.med+'</div>'+
  '<div class="item"><b>💉 Talaalii/Ittisa:</b><br>'+d.vac+'</div>'+
  '<div class="urgent"><b>🚨 Yeroo ariifachiisaa doktora argadhu:</b><br>'+d.urg+'</div>'+
  '<div class="item"><button class="g" onclick="qr(\''+d.id+'\')">QR code</button><div id="q-'+d.id+'"></div></div>'+
  '<small>Odeeffannoo waliigalaa; doktora bakka hin bu\'u.</small></div>';
}

function check(){
  const sel=[...document.querySelectorAll('#sx input:checked')].map(x=>x.value);
  const out=document.getElementById('out');
  if(!sel.length){out.innerHTML='<div class="warn">Mallattoo tokko yoo xiqqaate filadhu.</div>';return;}
  const res=D.map(d=>({d,s:d.s.filter(x=>sel.includes(x)).length})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).slice(0,4);
  if(!res.length){out.innerHTML='<div class="warn">Dhibee wal-fakkaatu hin argamne. Doktora argadhu.</div>';return;}
  out.innerHTML='<div class="warn">Kun diignoosisii miti. Dhibeewwan <b>ta\'uu danda\'an</b> qofa dha. Doktora argadhu.</div>'+res.map(r=>card(r.d,r.s)).join('');
}

function qr(id){
  const el=document.getElementById('q-'+id);
  el.innerHTML='<div id="qr"></div>';
  new QRCode(document.getElementById('qr'),{text:location.origin+location.pathname+'#'+id,width:180,height:180});
}

function resetAll(){
  document.querySelectorAll('#sx input').forEach(x=>x.checked=false);
  document.getElementById('out').innerHTML='';
}

document.getElementById('list').innerHTML=D.map(d=>'<div class="item"><button class="g" onclick="openOne(\''+d.id+'\')">'+d.i+' '+d.n+'</button></div>').join('');
function openOne(id){
  const d=D.find(x=>x.id===id); if(!d) return;
  document.getElementById('out').innerHTML=card(d,0);
  window.scrollTo(0,0);
}
if(location.hash) openOne(location.hash.slice(1));
</script>
</body>
</html>
